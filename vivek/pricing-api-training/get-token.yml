info:
  name: get-token
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/oauth/token"
  body:
    type: json
    data: |-
      {
        "client_id": "{{clientId}}",
        "client_secret": "{{clientSecret}}",
        "grant_type": "client_credentials"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("token", res.body.access_token);
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.status).to.equal(200);
        });

        test("token_type is Bearer", function () {
          expect(res.body.token_type).to.equal("Bearer");
        });

        test("expires_in is a number", function () {
          expect(res.body.expires_in).to.be.a("number");
        });

        test("token env var is set", function () {
          const t = bru.getEnvVar("token");
          expect(t).to.be.a("string");
          expect(t).to.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
